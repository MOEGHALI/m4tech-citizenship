<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M4TECH Citizenship Coach — معلّم الجنسية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M4TECH Citizen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0e1a2b;--card:#16283f;--card2:#1d3452;--tx:#eef3fa;--mut:#9fb2c8;--acc:#f5b942;--ok:#3ecf8e;--bad:#ff6b6b;--line:#2a4468}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.55}
#app{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#f5b942,#e0902a);color:#0e1a2b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;direction:ltr;flex:none}
.logo b{font-size:17px}.logo i{font-size:8px;font-style:normal;letter-spacing:.5px}
.top h1{font-size:17px;margin:0;flex:1}
.top h1 small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.back{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.hl{border-color:var(--acc)}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:14px 12px;font-size:17px;font-weight:700;margin:8px 0;background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:#0e1a2b;border:0}
.btn.ok{background:var(--ok);color:#06251a;border:0}
.btn.bad{background:var(--bad);color:#2a0606;border:0}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin:4px 4px 4px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.q{font-size:22px;font-weight:700;direction:ltr;text-align:left}
.ar{color:var(--mut)}
.tag{display:inline-block;background:var(--card2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin-left:6px}
.ans{background:#0b2a20;border:1px solid #1d6b4c;border-radius:12px;padding:12px;margin:10px 0}
.ans .en{font-size:20px;font-weight:700;color:#bff5dc}
.tip{background:#2b2410;border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0;color:#ffe3a6}
textarea,input[type=text]{width:100%;background:#0b1626;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:18px;font-family:inherit;direction:ltr;text-align:left}
textarea{min-height:76px;resize:vertical}
label{display:block;color:var(--mut);font-size:14px;margin:10px 0 4px}
.bar{height:8px;background:#0b1626;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right;color:var(--tx);font-size:15px}
.g b{display:block;font-size:16px}
.g.m{border-color:var(--ok)}.g.l{border-color:var(--acc)}
.verdict{border-radius:12px;padding:12px;font-weight:800;font-size:19px;margin:8px 0}
.verdict.ok{background:#0b2a20;color:var(--ok)}.verdict.no{background:#2e1212;color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:15px}
.tabs button.on{background:var(--acc);color:#0e1a2b;border:0;font-weight:700}
details{background:var(--card2);border-radius:10px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;color:var(--mut)}
ul{padding-inline-start:20px;margin:6px 0}
.small{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:#0b2a20;color:var(--ok)}.pill.no{background:#2e1212;color:var(--bad)}
.big{font-size:44px;text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>

/* ---------- grading ---------- */
function norm(s) { return ' ' + String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }
function hasKey(t, k) {
  k = norm(k).trim();
  if (!k) return false;
  if (/^\d+$/.test(k)) return new RegExp('(^|\\s)' + k + '(st|nd|rd|th)?(\\s|$)').test(t);
  return t.includes(' ' + k);   // matches word starts: law -> laws, tax -> taxes, free -> freed
}
function dynTokens(key) {
  const v = S.me[key.slice(1)] || '';
  return v.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3);
}
function grade(q, text) {
  const t = norm(text);
  if (t.trim().length < 1) return {ok:false, hits:0};
  const groups = q.keys.split(';');
  let hits = 0;
  for (const g of groups) {
    let alts = g.split('|');
    if (alts[0].startsWith('@')) {
      const toks = dynTokens(alts[0]);
      if (!toks.length) return {ok: t.trim().length > 2, hits: 1, unverified: true};
      alts = toks;
    }
    if (alts.some(k => hasKey(t, k))) hits++;
  }
  return {ok: hits >= q.need, hits};
}

};
R.group = g => {
  const s = grp(g), prev = g === 0 || grp(g - 1).mastered;
  shell(`مجموعة ${g + 1}: ${THEMES[g]}`, `أسئلة ${g * 8 + 1}–${g * 8 + 8}`, `

/* ---------- learn ---------- */
let L = null;
function startLearn(g) { L = {g, i: 0, rep: 0}; go('learn', null); }
R.learn = () => {
  const items = inG(L.g), q = items[L.i];
  const all = q.all.length ? `<details><summary>كل الأجوبة المقبولة رسمياً</summary><ul class="en">${q.all.map(a => `<li>${esc(a)}</li>`).join('')}</ul></details>` : '';
  shell(`تعلّم • م${L.g + 1}`, `سؤال ${L.i + 1} من ${items.length}`, `
  ${bar((L.i + 1) / items.length)}
  <div class="card"><span class="tag">رقم ${q.n}</span>
    <div class="q">${esc(q.en)}</div><div class="ar">${esc(q.ar)}</div>
    <button class="btn sm" onclick="sayQ(${q.n})">🔊 اسمع السؤال</button></div>
  <div class="ans"><div class="small">الجواب اللي بتحفظه</div><div class="en">${esc(sayText(q))}</div><div>${esc(q.arA)}</div>
    <button class="btn sm" onclick="sayA(${q.n})">🔊 اسمع الجواب</button>
    <button class="btn sm" onclick="sayBothQA(${q.n})">▶️ السؤال + الجواب</button></div>
  <div class="tip">💡 حيلة الحفظ: ${esc(q.tip)}</div>${all}
  <div class="card"><b>ردّد بصوت عالي بعد المعلّم</b><button class="btn" onclick="L.rep++;R.learn()">🗣️ ردّدتها (${L.rep}/3)</button></div>
  <div class="row"><button class="btn" onclick="learnMove(-1)" ${L.i === 0 ? 'disabled' : ''}>السابق</button><button class="btn pri" onclick="learnMove(1)">${L.i === items.length - 1 ? 'خلصنا ← تدريب' : 'التالي'}</button></div>`);
  setTimeout(() => sayBothQA(q.n), 200);
};
const sayQ = n => clip((SS && cur.name === 'ask' && SS.opts.mock ? 'o' : 'q') + n, qOf(n).en);
const sayA = n => { const q = qOf(n); clip('a' + n, sayText(q), () => { if (S.arVoice) setTimeout(() => speak(q.arA, 'ar-SA', 0.95), 250); }, 0.85); };
function sayBothQA(n) { const q = qOf(n); clip('q' + n, q.en, () => setTimeout(() => sayA(n), 450)); }
function learnMove(d) {
  const n = inG(L.g).length;
  if (d === 1 && L.i === n - 1) { grp(L.g).learned = true; save(); startDrill(L.g, true); return; }
  L.i = Math.max(0, Math.min(n - 1, L.i + d)); L.rep = 0; R.learn();
}

/* ---------- ask engine ---------- */
let SS = null;
function begin(type, ids, opts) {
  SS = {type, queue: ids.slice(), idx: 0, missed: [], first: {}, right: 0, wrong: 0, total: ids.length, opts, phase: 'q', log: [], round: 1};
  go('ask', null, type !== 'x');
}
const startDrill = (g, replace) => { if (replace) hist.pop(); begin('drill', shuffle(inG(g).map(q => q.n)), {g, hint: true, ar: true, loop: true}); };
const startRecite = g => begin('recite', shuffle(inG(g).map(q => q.n)), {g, hint: false, ar: false, loop: true});
function startReview() {
  let pool = Q.filter(q => P(q.n).w > P(q.n).r);
  if (pool.length < 10) { const m = Q.filter(q => grp(q.g).mastered || grp(q.g).learned); pool = pool.concat(shuffle(m.filter(q => !pool.includes(q)))); }
  if (!pool.length) pool = shuffle(Q);
  begin('review', shuffle(pool).slice(0, 15).map(q => q.n), {hint: false, ar: true, loop: false});
}
function startMock() { begin('mock', shuffle(Q).slice(0, 20).map(q => q.n), {hint: false, ar: false, loop: false, mock: true}); }

R.ask = () => {
  const n = SS.queue[SS.idx], q = qOf(n), o = SS.opts;
  const title = {drill: 'تدريب', recite: 'تسميع نهاية المجموعة', review: 'مراجعة', mock: 'اختبار تجريبي'}[SS.type];
  const sub = o.mock ? `سؤال ${SS.idx + 1} • صح ${SS.right} • غلط ${SS.wrong} (بتنجح بـ 12 صح)` : `سؤال ${SS.idx + 1} من ${SS.queue.length}${SS.round > 1 ? ' • جولة ' + SS.round + ' (الغلطات)' : ''}`;
  let body = bar(SS.idx / SS.queue.length) + `<div class="card hl"><span class="tag">${o.mock ? 'Question ' + (SS.idx + 1) : 'رقم ' + n}</span>
    <div class="q">${esc(q.en)}</div>${o.ar ? `<div class="ar">${esc(q.ar)}</div>` : ''}
    <button class="btn sm" onclick="sayQ(${n})">🔊 كرّر السؤال</button>${o.hint ? `<button class="btn sm" onclick="document.getElementById('hint').style.display='block'">💡 تلميح</button>` : ''}</div>`;
  if (o.hint) body += `<div id="hint" class="tip" style="display:none">${esc(q.tip)}</div>`;
  if (SS.phase === 'q') {
    body += `<div class="card"><b>جاوب بصوت عالي ثم اضغط «كشف»</b>
    <div class="small">أو اكتب جوابك — وللحكي: دوس زر الميكروفون 🎤 اللي بكيبورد الجوال وإحكي، والتطبيق بيصحّح لحاله.</div>
    <textarea id="ans" placeholder="Your answer..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="btn" id="micbtn" onclick="listen()">🎤 احكي جوابك (إنجليزي)</button><div class="small" id="micst"></div></div>
    <button class="btn pri" onclick="checkAns()">✔ تحقق من جوابي</button>
    <button class="btn" onclick="revealAns()">👁️ جاوبت بصوتي — اكشف الجواب</button>`;
  } else {
    const f = SS.fb;
    body += (f.auto !== null ? `<div class="verdict ${f.auto ? 'ok' : 'no'}">${f.auto ? '✔ جوابك صح' : '✘ لسا مش مضبوط'}${f.unv ? ' (ما قدرت أتحقق من الاسم، راجعه)' : ''}</div>` : '') +
      `<div class="ans"><div class="small">الجواب</div><div class="en">${esc(sayText(q))}</div><div>${esc(q.arA)}</div></div>
      <div class="tip">💡 ${esc(q.tip)}</div>` +
      (q.all.length ? `<details><summary>كل الأجوبة المقبولة</summary><ul class="en">${q.all.map(a => `<li>${esc(a)}</li>`).join('')}</ul></details>` : '') +
      `<div class="small">${f.auto === null ? 'قيّم نفسك بصدق:' : 'إذا التصحيح الآلي غلط، اختر بنفسك:'}</div>
      <div class="row"><button class="btn ok" onclick="rec(true)">✔ كنت صح</button><button class="btn bad" onclick="rec(false)">✘ كنت غلط</button></div>`;
  }
  shell(title, sub, body);
  if (SS.phase === 'q') setTimeout(() => sayQ(n), 150);
};
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const st = document.getElementById('micst'), btn = document.getElementById('micbtn');
  if (!SR) { st.textContent = 'المتصفح ما بيدعم الميكروفون هون. استعمل زر الميكروفون 🎤 اللي بكيبورد الجهاز.'; return; }
  if (REC) { try { REC.stop(); } catch(e) {} return; }
  stopAll();
  const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = true;
  let txt = '', err = '';
  r.onstart = () => { st.textContent = '🎙️ عم أسمعك… احكي الجواب وبعدين دوس «خلصت»'; btn.textContent = '⏹ خلصت'; };
  r.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript + ' '; txt = s.trim(); const ta = document.getElementById('ans'); if (ta) ta.value = txt; };
  r.onerror = e => { err = e.error; };
  r.onend = () => {
    REC = null; btn.textContent = '🎤 احكي جوابك (إنجليزي)';
    if (err === 'not-allowed' || err === 'service-not-allowed') { st.textContent = 'الميكروفون ممنوع. اسمح له من إعدادات المتصفح/الموقع، أو افتح البرنامج بـ Safari مباشرة بدل الأيقونة.'; return; }
    if (txt) { st.textContent = '✔ سمعتك'; checkAns(); } else st.textContent = 'ما سمعتك' + (err ? ' (' + err + ')' : '') + '. جرّب مرة ثانية.';
  };
  REC = r; try { r.start(); } catch(e) { REC = null; st.textContent = 'ما قدرت أشغّل الميكروفون.'; }
}
function checkAns() {
  const n = SS.queue[SS.idx], q = qOf(n), t = ($('#ans') || {}).value || '';
  if (!t.trim()) { revealAns(); return; }
  const r = grade(q, t);
  SS.phase = 'fb'; SS.fb = {auto: r.ok, unv: r.unverified, text: t};
  R.ask();
  const fi = Math.floor(Math.random() * (r.ok ? 5 : 3));
  clip((r.ok ? 'f' : 't') + fi, r.ok ? PRAISE[fi] : TRY[fi], () => { if (!r.ok) clip('a' + n, sayText(q), null, 0.88); });
}
function revealAns() {
  const n = SS.queue[SS.idx], q = qOf(n);
  SS.phase = 'fb'; SS.fb = {auto: null}; R.ask(); clip('a' + n, sayText(q));
}
function rec(ok) {
  const n = SS.queue[SS.idx], p = P(n);
  if (SS.first[n] === undefined) SS.first[n] = ok;
  if (ok) { p.r++; p.box = Math.min(3, p.box + 1); SS.right++; } else { p.w++; p.box = 0; SS.wrong++; if (!SS.missed.includes(n)) SS.missed.push(n); }
  SS.log.push({n, ok});
  save();
  if (SS.opts.mock && (SS.right >= 12 || SS.wrong >= 9)) { SS.phase = 'q'; return finish(); }
  SS.idx++; SS.phase = 'q';
  if (SS.idx >= SS.queue.length) {
    if (SS.opts.loop && SS.missed.length) { SS.queue = shuffle(SS.missed); SS.missed = []; SS.idx = 0; SS.round++; SS.note = true; }
    else return finish();
  }
  R.ask();
}
function finish() {
  const o = SS.opts, g = o.g;
  const firstRight = Object.values(SS.first).filter(Boolean).length;
  let body = '';
  if (o.mock) {
    const pass = SS.right >= 12;
    body = `<div class="big">${pass ? '🎉' : '📖'}</div><div class="verdict ${pass ? 'ok' : 'no'}">${pass ? 'نجحت بالاختبار التجريبي' : 'لسا ما وصلنا لـ 12 صح'} — صح ${SS.right} / غلط ${SS.wrong}</div>`;
    const bad = SS.log.filter(x => !x.ok).map(x => qOf(x.n));
    if (bad.length) body += `<div class="card"><b>راجع هدول:</b>${bad.map(q => `<div class="small"><span class="tag">${q.n}</span><span class="en">${esc(q.en)}</span><br><span class="en" style="color:#bff5dc">${esc(sayText(q))}</span></div>`).join('')}</div>`;
    body += `<button class="btn pri" onclick="startMock()">اختبار جديد</button>`;
  } else if (SS.type === 'recite') {
    const s = grp(g); if (s.best === null || firstRight > s.best) s.best = firstRight; s.mastered = true; save();
    body = `<div class="big">${firstRight >= 7 ? '🏆' : '✅'}</div><div class="verdict ok">تثبّتت المجموعة ${g + 1}! أول محاولة: ${firstRight}/${inG(g).length}</div>
    <div class="card small">${firstRight < 7 ? 'نصيحتي: أعد التسميع بكرا وإنت متأكد من الغلطات، عشان تبقى بالراس.' : 'ممتاز — كمّل للمجموعة اللي بعدها وخلّي مراجعتك كل يوم.'}</div>
    ${g < NG - 1 ? `<button class="btn pri" onclick="hist.length=0;go('group',${g + 1},false)">المجموعة ${g + 2} ←</button>` : '<div class="verdict ok">خلصت كل المجموعات! جرّب الاختبار التجريبي.</div>'}`;
  } else {
    body = `<div class="big">👏</div><div class="verdict ok">خلصنا — أول محاولة: ${firstRight}/${SS.total}</div>
    ${SS.type === 'drill' ? `<button class="btn ok" onclick="hist.pop();startRecite(${g})">الآن: تسميع نهاية المجموعة 🎯</button>` : ''}`;
  }
  body += `<button class="btn" onclick="hist.length=0;go('home',null,false)">الرئيسية</button>`;
  shell('النتيجة', '', body, true);
  clip(o.mock ? (SS.right >= 12 ? 'pass' : 'fail') : 'well', o.mock ? (SS.right >= 12 ? 'Congratulations. You passed.' : 'Keep practicing. You can do it.') : 'Well done.', null, 0.95);
}

  const tabs = ['خطوات اليوم', 'اتكلم مع الضابط', 'اختبار القراءة', 'اختبار الكتابة', 'أسئلة N-400', 'مقابلة تجريبية'];
  const t = IV.tab;
  let b = `<div class="tabs">${tabs.map((x, i) => `<button class="${i === t ? 'on' : ''}" onclick="IV.tab=${i};R.interview()">${x}</button>`).join('')}</div>`;
  if (t === 0) b += STEPS.map(s => `<div class="card"><b>${s[0]}</b><ul>${s[1].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('') +
    `<div class="card small">تنبيه: هاد شرح عام للمساعدة. للحالات الخاصة (توقيفات، سفر طويل، ضرائب، أي شي غير عادي) اسأل محامي هجرة. وتابع تعليمات USCIS الرسمية.</div>`;
  if (t === 1) b += `<div class="card small">جمل جاهزة لتحكيها بالمقابلة. اضغط 🔊 اسمعها وكرّرها بصوت عالي.</div>` + PHRASES.map((p, i) => `<div class="card"><div class="q" style="font-size:19px">${esc(p[0])}</div><div class="ar">${esc(p[1])}</div><button class="btn sm" onclick="clip('p${i}',PHRASES[${i}][0].replace(/___/g,'blank'),null,0.85)">🔊 اسمع</button></div>`).join('');
  if (t === 2) b += `<div class="card small">بالقراءة: الضابط بيعطيك لحد 3 جمل وبتقرأ جملة وحدة صح. اقرأ بصوت عالي، وبعدين اسمع النطق الصحيح وقيّم نفسك.</div>` + READ.map((s, i) => `<div class="card"><div class="q" style="font-size:20px">${esc(s)}</div><button class="btn sm" onclick="clip('r${i}',READ[${i}],null,0.8)">🔊 اسمع النطق</button></div>`).join('');
  if (t === 3) b += `<div class="card small">بالكتابة: الضابط بيقرأ جملة وإنت بتكتبها. اضغط 🔊، اكتب اللي سمعته، وتحقق. (كتابة واضحة؛ الأخطاء الصغيرة بالتنقيط/الحروف الكبيرة عادةً مسموحة حسب إرشادات USCIS.)</div><div id="wr"></div>`;
  if (t === 4) b += `<div class="card small">الضابط بيمشي على ورقة N-400 اللي قدّمتها. هاي أكتر الأسئلة شيوعاً. أجوبتك الشخصية لازم تطابق الورقة — عبّيها بالإعدادات.</div>` + NQ.map(q => `<div class="card"><div class="q" style="font-size:19px">${esc(q[0])}</div><div class="ar">${esc(q[1])}</div><div class="ans"><div class="small">شكل الجواب</div><div class="en">${esc(q[3])}</div>${q[2] && S.me[q[2]] ? `<div class="small">إجابتك المحفوظة: ${esc(S.me[q[2]])}</div>` : ''}</div></div>`).join('');
  if (t === 5) b += `<div class="card small">الضابط بيسألك بصوته، وإنت جاوب بصوت عالي، بعدها قيّم نفسك. 16 سؤال من أسئلة N-400.</div><button class="btn pri" onclick="startMockN()">ابدأ المقابلة التجريبية</button>`;
  shell('المقابلة كاملة', 'كل شي غير أسئلة الـ civics', b);
  if (t === 3) renderWrite();
};
let WI = 0;
function renderWrite() {
  const s = WRITE[WI % WRITE.length];
  $('#wr').innerHTML = `<div class="card"><b>جملة ${(WI % WRITE.length) + 1}</b><button class="btn sm" onclick="clip('w'+(WI%WRITE.length),WRITE[WI%WRITE.length],null,0.7)">🔊 اسمع الجملة</button>
  <textarea id="wv" placeholder="Write the sentence..." autocorrect="off" spellcheck="false"></textarea>
  <button class="btn pri" onclick="checkWrite()">تحقق</button><div id="wres"></div></div>`;
  setTimeout(() => clip('w' + (WI % WRITE.length), s, null, 0.7), 200);
}
function checkWrite() {
  const s = WRITE[WI % WRITE.length], v = $('#wv').value;
  const a = norm(s).trim(), b = norm(v).trim(), ok = a === b;
  $('#wres').innerHTML = `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✔ صح' : '✘ فيها غلط'}</div><div class="en ans">${esc(s)}</div><button class="btn" onclick="WI++;renderWrite()">الجملة اللي بعدها</button>`;
}
let NS = null;
function startMockN() { NS = {i: 0, show: false}; go('mockn'); }
R.mockn = () => {
  const q = NQ[NS.i];
  shell('مقابلة تجريبية', `سؤال ${NS.i + 1} من ${NQ.length}`, `${bar(NS.i / NQ.length)}<div class="card hl"><div class="q">${esc(q[0])}</div><div class="ar">${NS.show ? esc(q[1]) : ''}</div>
  <button class="btn sm" onclick="clip('n'+NS.i,NQ[NS.i][0])">🔊 كرّر السؤال</button></div>
  <div class="card small">جاوب بصوت عالي بالإنجليزي. بعدين شوف شكل الجواب.</div>
  <button class="btn" onclick="NS.show=true;R.mockn()">👁️ الترجمة وشكل الجواب</button>
  ${NS.show ? `<div class="ans"><div class="en">${esc(q[3])}</div>${q[2] && S.me[q[2]] ? `<div class="small">إجابتك: ${esc(S.me[q[2]])}</div>` : ''}</div>` : ''}
  <button class="btn pri" onclick="nextN()">${NS.i === NQ.length - 1 ? 'خلصنا' : 'السؤال اللي بعده'}</button>`);
  if (!NS.show) setTimeout(() => clip('n' + NS.i, q[0]), 200);
};
function nextN() { NS.i++; NS.show = false; if (NS.i >= NQ.length) { shell('خلصت المقابلة التجريبية', '', `<div class="big">👏</div><div class="card">ممتاز. كرّرها لحد ما تصير أجوبتك طبيعية وبسرعة. وراجع ورقة N-400 مرة أخيرة قبل المقابلة.</div><button class="btn pri" onclick="hist.length=0;go('home',null,false)">الرئيسية</button>`, true); } else R.mockn(); }

try { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e) {}
loadAudio();
R.home();
</script>
